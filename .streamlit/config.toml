# Tema visual de Ceni: violeta eléctrico como color principal, con coral, menta,
# sol, cielo y rosa para darle vida (etiquetas, avatares y tarjetas).
# Tipografía: Bricolage Grotesque en los títulos y Plus Jakarta Sans en el texto.
# Lo que el tema no cubre (degradados, tarjetas, avatares) está en app/estilo.py.

[theme]
base = "light"
primaryColor = "#5B47FB"
backgroundColor = "#F7F6FF"
secondaryBackgroundColor = "#EFEDFF"
textColor = "#1D1A3A"
linkColor = "#5B47FB"
borderColor = "#E3E0F8"
showWidgetBorder = true
baseRadius = "0.85rem"
buttonRadius = "full"
font = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
headingFont = "Bricolage Grotesque:https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&display=swap"
headingFontWeights = [800, 700, 700, 700, 600, 600]
headingFontSizes = ["2.3rem", "1.7rem", "1.35rem", "1.12rem", "1rem", "0.9rem"]

# Colores de avisos, badges y etiquetas (color, fondo claro y texto oscuro del mismo tono).
blueColor = "#339AF0"
blueBackgroundColor = "#E0F0FF"
blueTextColor = "#1864AB"
greenColor = "#12B886"
greenBackgroundColor = "#DCF7EC"
greenTextColor = "#087F5B"
orangeColor = "#FF7A59"
orangeBackgroundColor = "#FFE8E1"
orangeTextColor = "#B33A1C"
violetColor = "#7C5CFF"
violetBackgroundColor = "#EEEBFF"
violetTextColor = "#4331D6"
yellowColor = "#FFB020"
yellowBackgroundColor = "#FFF3D6"
yellowTextColor = "#8F5B00"
redColor = "#F03E6E"
redBackgroundColor = "#FFE3EB"
redTextColor = "#B4234D"
grayColor = "#8A88A8"
grayBackgroundColor = "#EEEEF6"
grayTextColor = "#55536E"

# Barra lateral oscura (el degradado se aplica en app/estilo.py).
[theme.sidebar]
backgroundColor = "#24166B"
secondaryBackgroundColor = "#33248A"
textColor = "#F3F1FF"
primaryColor = "#FFB020"
borderColor = "#3B2C93"
linkColor = "#FFD27A"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
